name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned build and foundation audits
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out this revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned Lean toolchain
        id: setup
        shell: bash
        run: |
          if [[ $(<lean-toolchain) != leanprover/lean4:v4.35.0 ]]; then
            echo "Update the release asset and checksum for the new Lean pin."
            exit 1
          fi
          archive="$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          # The release API serves the official archive when the release-page
          # download route times out.
          curl --fail --silent --show-error --location --retry 4 --connect-timeout 15 \
            --max-time 600 --header 'Accept: application/octet-stream' \
            --output "$archive" https://api.github.com/repos/leanprover/lean4/releases/assets/634574462
          printf '%s  %s\n' 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d "$archive" |
            sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          toolchain="$RUNNER_TEMP/lean-4.35.0-linux/bin"
          "$toolchain/lean" --version
          "$toolchain/lake" --version
          echo "$toolchain" >> "$GITHUB_PATH"

      - name: Restore cached Mathlib dependencies
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe cache get

      - name: Check pinned dependency revisions
        id: pins
        run: python3 scripts/prepare_ci.py

      - name: Restore compiled pinned predecessors
        id: predecessor-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages/special_transformations/.lake/build
            .lake/packages/acvf_qe/.lake/build
          key: predecessor-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build the pinned predecessor
        id: predecessor-build
        env:
          LEAN_NUM_THREADS: "4"
        shell: bash
        run: |
          mkdir -p .scratch/ci-verified
          lake build SpecialTransformations 2>&1 | tee .scratch/ci-verified/PredecessorBuild.log

      - name: Save compiled pinned predecessors
        if: ${{ steps.predecessor-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/packages/special_transformations/.lake/build
            .lake/packages/acvf_qe/.lake/build
          key: predecessor-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build the project and predecessor import
        id: build
        env:
          LEAN_NUM_THREADS: "4"
        shell: bash
        run: |
          mkdir -p .scratch/ci-verified
          lake -R build 2>&1 | tee .scratch/ci-verified/Build.log

      - name: Audit inherited headlines and run available section verifiers
        id: audits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: lake env python3 scripts/verify_ci.py

      - name: Publish verification summary
        if: ${{ always() }}
        shell: bash
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Lean verification

          | Check | Outcome |
          | --- | --- |
          | Pinned dependency revisions | ${{ steps.pins.outcome }} |
          | Project and predecessor import build | ${{ steps.build.outcome }} |
          | Inherited QE headline types and axioms | ${{ steps.audits.outputs.foundation || 'skipped' }} |
          | Section 2 verifier | ${{ steps.audits.outputs.section2 || 'skipped' }} |
          | Section 3 verifier | ${{ steps.audits.outputs.section3 || 'skipped' }} |
          | Section 4 verifier | ${{ steps.audits.outputs.section4 || 'skipped' }} |
          | Section 5 verifier | ${{ steps.audits.outputs.section5 || 'skipped' }} |
          | Section 6 verifier | ${{ steps.audits.outputs.section6 || 'skipped' }} |
          | Section 7 verifier | ${{ steps.audits.outputs.section7 || 'skipped' }} |

          Download the verification artifact for compiler logs and headline audits.
          A skipped check is not a passed check. Each section's STATUS.md
          identifies its audited declarations and remaining proof obligations.
          Explicit hypotheses and fidelity to the paper still need review.
          SUMMARY

      - name: Retain verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: lean-verification-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            lean-toolchain
            lake-manifest.json
            .scratch/ci-verified/
            .scratch/section*-verified/
