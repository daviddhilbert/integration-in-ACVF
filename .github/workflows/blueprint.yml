name: Build integration blueprint

on:
  push:
    paths:
      - 'blueprint/**'
      - 'scripts/*blueprint.py'
      - '.github/workflows/blueprint.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'blueprint/**'
      - 'scripts/*blueprint.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: blueprint/requirements.txt
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev
          python -m pip install -r blueprint/requirements.txt
      - name: Build and check the web blueprint
        run: |
          python scripts/check_blueprint.py
          leanblueprint web
          python scripts/check_blueprint.py --rendered
      - uses: actions/upload-artifact@v4
        with:
          name: integration-blueprint-web
          path: blueprint/web
          if-no-files-found: error
