name: Publish checked integration release

on:
  push:
    branches: [main]
    paths:
      - 'docs/RELEASE-v1.0.0.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the current verified main revision
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_COMMIT"
          proof=$(python -c 'import json; print(json.load(open("blueprint/proof-source-manifest.json"))["proof_revision"])')
          gh api "repos/$GH_REPO/actions/workflows/lean.yml/runs?head_sha=$proof&status=success" > /tmp/proof-ci.json
          python -c 'import json,sys; x=json.load(open("/tmp/proof-ci.json")); assert any(r["head_sha"]==sys.argv[1] and r["conclusion"]=="success" for r in x["workflow_runs"]), "No passing CI for proof revision"' "$proof"
          git fetch --no-tags --depth=1 "https://github.com/$GH_REPO.git" "$proof"
          python scripts/check_release_proof.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: blueprint/requirements.txt
      - name: Install web and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev latexmk texlive-latex-extra
          python -m pip install -r blueprint/requirements.txt
      - name: Build checked submission assets
        run: |
          python scripts/check_blueprint.py
          leanblueprint web
          python scripts/check_blueprint.py --rendered
          leanblueprint pdf
          python scripts/package_blueprint.py --output release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: integration-v1.0.0-release-assets
          path: release-assets
          if-no-files-found: error
      - name: Publish v1.0.0
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/git/ref/tags/v1.0.0" --jq '.object.sha')" = '7675d31332f20421c803ea16af84964ed74cd51f'
            gh release edit v1.0.0 \
              --title 'v1.0.0 - Integration in algebraically closed valued fields' \
              --notes-file docs/RELEASE-v1.0.0.md
            gh release upload v1.0.0 release-assets/* --clobber
            exit 0
          fi
          gh release create v1.0.0 release-assets/* \
            --target "$RELEASE_COMMIT" \
            --title 'v1.0.0 - Integration in algebraically closed valued fields' \
            --notes-file docs/RELEASE-v1.0.0.md
