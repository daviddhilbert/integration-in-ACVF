status:
  scope: 'Exactly two headline results are selected: IntegrationInACVF.Section3ACVF.FullOpenToOpenPartition.proposition_3_19
    and IntegrationInACVF.Section4.lemma_4_8. The former retains the original real and imaginary
    parameter base, small real base, genuine saturation, ACVF(0,0), a definable nontrivial
    Gamma value, original-base definability and an actual VF bijection. The latter retains
    its original VF/Gamma-generated base, small real base, saturation and ACVF(0,0), a named
    nontrivial Gamma value and definability of the actual VF-squared set. It produces an actual
    finite-arity Gamma RV map whose nonempty fibres have definable two-cell data. Other formalized
    results, including the Section 7 measured kernel and function integration, are not claims
    of this Comparator configuration.'
