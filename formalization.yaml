version: v0.4
project:
  name: Integration in algebraically closed valued fields
  description: Two geometric preparation theorems for integration in algebraically closed
    valued fields. Proposition 3.19 partitions an original-base definable VF bijection into
    finitely many definable pieces on which it is open-to-open. Lemma 4.8 decomposes an original-Gamma-base
    definable subset of VF squared into two-cell fibres of a definable map to a finite RV
    power. The cell positioning graph and both paradigms are definable over the original base
    together with the output RV tuple. Actual saturation, characteristic, parameter-base and
    named-value hypotheses remain in the formal statements. The larger repository develops
    Sections 2–7, including ordinary and measured integration; those additional results are
    outside this Palomar selection.
  authors:
  - Yimu Yin
  responsible_maintainers:
  - Yimu Yin
  license: MIT
