fidelity:
  divergences: The two selected statements retain their displayed original parameter bases
    and standing model hypotheses. The shared one-sorted encoding has the named RV inverse
    and a single absorbing RV element. Mathlib's multiplicative valuation order reverses the
    paper's additive order. Broader accepted corrections and the author-adopted weighted measured-zero
    convention concern other parts of the repository and are not additional selected claims
    here. No novelty of the source mathematics or priority over earlier formalizations is
    claimed.
