name = "integration_in_acvf"
version = "0.1.0"
description = "Formalization of Yimu Yin's Integration in algebraically closed valued fields"
defaultTargets = ["IntegrationInACVF"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "special_transformations"
git = "https://github.com/daviddhilbert/special-transformations.git"
rev = "9cc9760892092dd34cfad4a6dee655843c52f30c"

[[lean_lib]]
name = "IntegrationInACVF"
roots = ["IntegrationInACVF"]

[[lean_lib]]
name = "IntegrationSection2"
srcDir = "section 2"
roots = ["IntegrationSection2.Library"]
globs = ["IntegrationSection2.Library", "IntegrationSection2.GammaFiniteImage"]

[[lean_lib]]
name = "IntegrationSection3"
srcDir = "section 3"
roots = ["IntegrationSection3.Library"]
globs = ["IntegrationSection3.Library", "IntegrationSection3.Atomicity", "IntegrationSection3.BallSupport", "IntegrationSection3.DefinableFamilies", "IntegrationSection3.ParametricAtomicity", "IntegrationSection3.ImaginaryFamilies", "IntegrationSection3.InterpretedRanges", "IntegrationSection3.ImaginaryParameters", "IntegrationSection3.ImaginaryBaseFamilies", "IntegrationSection3.AdjoinParameters", "IntegrationSection3.ImaginaryTupleAtomicity", "IntegrationSection3.ImaginaryBaseRanges", "IntegrationSection3.PuncturedDecomposition", "IntegrationSection3.ProfileAtomicity", "IntegrationSection3.InfiniteCosets", "IntegrationSection3.MinimalBallSupport", "IntegrationSection3.SupportFormulas", "IntegrationSection3.RegionFormulas", "IntegrationSection3.StatementChecks"]

[[lean_lib]]
name = "IntegrationSection3ACVF"
srcDir = "section 3"
roots = ["IntegrationSection3ACVF.Library"]
globs = ["IntegrationSection3ACVF.Library", "IntegrationSection3ACVF.Geometry", "IntegrationSection3ACVF.BallPresentation", "IntegrationSection3ACVF.GammaAtomicity", "IntegrationSection3ACVF.BallCosetAtomicity", "IntegrationSection3ACVF.NamedRadiusAtomicity", "IntegrationSection3ACVF.GammaRadiusAtomicity", "IntegrationSection3ACVF.ParameterPresentation", "IntegrationSection3ACVF.FullBaseAtomicity", "IntegrationSection3ACVF.AdjoinBall", "IntegrationSection3ACVF.FullBaseDefinability", "IntegrationSection3ACVF.FullGammaSyntax", "IntegrationSection3ACVF.FullGammaPoint", "IntegrationSection3ACVF.AdjoinGamma", "IntegrationSection3ACVF.FullGammaAtomicity", "IntegrationSection3ACVF.FullBallCoset", "IntegrationSection3ACVF.FullGammaRadius", "IntegrationSection3ACVF.PuncturedGeometry", "IntegrationSection3ACVF.FullCosetExceptions", "IntegrationSection3ACVF.FullProfileCosets", "IntegrationSection3ACVF.GammaCosetGeometry", "IntegrationSection3ACVF.OpenBallConstancy", "IntegrationSection3ACVF.PaperBalls", "IntegrationSection3ACVF.CanonicalBallSupport", "IntegrationSection3ACVF.BallCodeGeometry", "IntegrationSection3ACVF.CanonicalSupportFamily", "IntegrationSection3ACVF.CanonicalRegions"]
