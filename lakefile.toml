name = "integration_in_acvf"
version = "0.1.0"
description = "Formalization of Yimu Yin's Integration in algebraically closed valued fields"
defaultTargets = ["IntegrationInACVF"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "special_transformations"
git = "https://github.com/daviddhilbert/special-transformations.git"
rev = "9cc9760892092dd34cfad4a6dee655843c52f30c"

[[lean_lib]]
name = "IntegrationInACVF"
roots = ["IntegrationInACVF"]

[[lean_lib]]
name = "IntegrationSection2"
srcDir = "section 2"
roots = ["IntegrationSection2.Library"]
globs = ["IntegrationSection2.Library", "IntegrationSection2.GammaFiniteImage"]

[[lean_lib]]
name = "IntegrationSection3"
srcDir = "section 3"
roots = ["IntegrationSection3.Library"]
globs = ["IntegrationSection3.Library", "IntegrationSection3.Atomicity", "IntegrationSection3.BallSupport", "IntegrationSection3.DefinableFamilies", "IntegrationSection3.ParametricAtomicity", "IntegrationSection3.ImaginaryFamilies", "IntegrationSection3.InterpretedRanges", "IntegrationSection3.ImaginaryParameters", "IntegrationSection3.ImaginaryBaseFamilies", "IntegrationSection3.AdjoinParameters", "IntegrationSection3.ImaginaryTupleAtomicity", "IntegrationSection3.ImaginaryBaseRanges", "IntegrationSection3.PuncturedDecomposition", "IntegrationSection3.ProfileAtomicity", "IntegrationSection3.InfiniteCosets", "IntegrationSection3.MinimalBallSupport", "IntegrationSection3.SupportFormulas", "IntegrationSection3.RegionFormulas", "IntegrationSection3.HoleFormulas", "IntegrationSection3.CodeEquality", "IntegrationSection3.AtomicRegions", "IntegrationSection3.ValuationRadius", "IntegrationSection3.ClassCoverage", "IntegrationSection3.PunctureCuts", "IntegrationSection3.PunctureFormulas", "IntegrationSection3.ValuationEnlargement", "IntegrationSection3.AffineHoleCosets", "IntegrationSection3.BallInclusionFormulas", "IntegrationSection3.DefinablePartitions", "IntegrationSection3.CoarsePartition", "IntegrationSection3.BoundedCoverFormulas", "IntegrationSection3.AtomicPuncturedPartition", "IntegrationSection3.ImaginaryBaseImages", "IntegrationSection3.DefinableHoleRefinement", "IntegrationSection3.AffineHoleClosure", "IntegrationSection3.PuncturedSupport", "IntegrationSection3.ImaginaryTupleFormulas", "IntegrationSection3.AffineHoleFormulas", "IntegrationSection3.FiniteBallHulls", "IntegrationSection3.FibreSupportFormulas", "IntegrationSection3.RelationalPreimages", "IntegrationSection3.CoarseRelationFibres", "IntegrationSection3.SupportInsideBall", "IntegrationSection3.FiniteCofiniteClasses", "IntegrationSection3.QuotientCover", "IntegrationSection3.FiniteClosedHull", "IntegrationSection3.AtomicFiniteFibres", "IntegrationSection3.NamedFamilyFibres", "IntegrationSection3.Prope